[General]
# Fuente (GNOME 48+ usa Adwaita Sans; antes Cantarell)
font=Adwaita Sans
# Formato de fecha y hora de la barra superior (sintaxis de Qt)
dateFormat=d MMM
timeFormat=HH:mm
# Logo inferior; ruta relativa al tema o absoluta. Vacío = sin logo
logo=logo.svg
# Color de fondo y color de acento (anillo de foco)
background=#222226
accent=#78aeed
# Fondo de imagen opcional (vacío = color liso como GDM)
backgroundImage=
