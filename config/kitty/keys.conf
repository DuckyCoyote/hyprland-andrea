# Atajos de kitty de awesome-minimal (github.com/DuckyCoyote/awesome-minimal, misc/kitty/kitty.conf).
# Los incluye config/kitty/theme.conf (generado), así que valen con cualquier tema.

# Moverse entre ventanas (splits) de kitty
map ctrl+left neighboring_window left
map ctrl+up neighboring_window up
map ctrl+right neighboring_window right
map ctrl+down neighboring_window down

# Portapapeles propios: F3/F5 copian la selección a los búferes a/b, F4/F6 los pegan
map f3 copy_to_buffer a
map f5 copy_to_buffer b
map f4 paste_from_buffer a
map f6 paste_from_buffer b

# Maximizar/restaurar la ventana actual (diseño «stack»)
map ctrl+shift+z toggle_layout stack

# Ventana y pestaña nuevas en el directorio actual
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# Alt+flechas: palabra anterior/siguiente en la línea de órdenes
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66

# Insertar un carácter Unicode
map alt+} input_unicode_character
